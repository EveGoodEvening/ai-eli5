<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Visual, plain-language guides to how modern AI systems learn.">
<title>ELI5 AI — visual explainers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="language.css">
<script src="language.js" defer></script>
<script src="index.js" defer></script>
<style>
:root{--paper:#edf0f5;--card:#fafbfc;--ink:#111c36;--muted:#59647a;--blue:#2747d8;--pink:#f04486;--yellow:#f3c83d;--display:"Archivo",system-ui,sans-serif;--body:"Newsreader",Georgia,serif;--mono:"DM Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(rgba(17,28,54,.045) 1px,transparent 1px),var(--paper);background-size:100% 32px;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{width:min(1100px,calc(100% - 40px));margin:0 auto}
header{padding:clamp(56px,10vw,120px) 0 52px;border-bottom:2px solid var(--ink)}
.kicker,.count,.number,.action,.status{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em}
.kicker{font-size:.72rem;color:var(--blue);margin:0 0 24px}
h1{margin:0;max-width:11ch;font-family:var(--display);font-size:clamp(3.4rem,11vw,8.8rem);font-variation-settings:"wdth" 80,"wght" 900;line-height:.82;letter-spacing:-.045em;text-transform:uppercase}
h1 span{display:block;color:var(--blue)}
.intro{margin:38px 0 0;max-width:38ch;font-size:clamp(1.2rem,2.2vw,1.55rem);line-height:1.42}
main{padding:64px 0 100px}
.index-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:28px}
h2{font-family:var(--display);font-size:clamp(1.8rem,4vw,3rem);font-variation-settings:"wdth" 85,"wght" 850;letter-spacing:-.03em;margin:0}
.count{font-size:.68rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{display:flex;flex-direction:column;min-height:270px;padding:23px;background:var(--card);border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);color:inherit;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink);background:#fff}
.card:focus-visible{outline:4px solid var(--yellow);outline-offset:5px}
.station{width:20px;height:20px;border:5px solid var(--blue);border-radius:50%;margin-bottom:42px}
.card:nth-child(even) .station{border-color:var(--pink)}
.number{font-size:.64rem;color:var(--muted);margin-bottom:12px}
.card h3{overflow-wrap:anywhere;font-family:var(--display);font-size:clamp(1.5rem,2.7vw,2.1rem);font-variation-settings:"wdth" 85,"wght" 800;line-height:.98;letter-spacing:-.025em;margin:0 0 14px}
.slug{color:var(--muted);font-family:var(--mono);font-size:.72rem;line-height:1.5;overflow-wrap:anywhere;margin:0 0 26px}
.action{margin-top:auto;font-size:.64rem;color:var(--blue)}
.action::after{content:" →";font-size:1rem}
.status{grid-column:1/-1;font-size:.72rem;color:var(--muted);padding:24px 0}
.status.error{color:#a22655}
footer{border-top:2px solid var(--ink);padding:28px 0 44px}.footer-note{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.wrap{width:min(100% - 28px,1100px)}.grid{grid-template-columns:1fr}.card{min-height:230px}.index-head{align-items:flex-start;flex-direction:column;gap:8px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
html[lang="zh-CN"]{--body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
html[lang="zh-CN"] h1{max-width:9ch;line-height:1.12;letter-spacing:-.03em}
html[lang="zh-CN"] .card h3{line-height:1.3;letter-spacing:0}
html[lang="zh-CN"] .intro{line-height:1.7}
.index-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.retry{font:inherit;cursor:pointer;border:1px solid currentColor;background:transparent;color:var(--blue);padding:8px 12px;border-radius:4px}
.retry:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<div class="eli5-site-nav" role="navigation" aria-label="Language selection">
  <a class="eli5-nav-home" href="index.html" aria-label="ELI5 AI home">ELI5 AI</a>
  <div class="eli5-languages">
    <a href="?lang=zh-CN" data-language="zh-CN" lang="zh-CN" hreflang="zh-CN">简体中文</a>
    <a href="?lang=en" data-language="en" lang="en" hreflang="en">English</a>
  </div>
</div>
<header><div class="wrap"><p class="kicker" data-copy="kicker">A small atlas of machine learning</p><h1><span data-copy="headlineFirst" style="color:inherit">AI, made</span><span data-copy="headlineLast">plain.</span></h1><p class="intro" data-copy="intro">Visual guides to what happens before, during, and after a language model learns to talk.</p></div></header>
<main class="wrap"><div class="index-head"><h2 data-copy="choose">Choose an explainer</h2><div class="index-actions"><span class="count" id="count">Looking for pages…</span><button type="button" class="retry" id="retry" hidden>Try again</button></div></div><div class="grid" id="pages" aria-live="polite" aria-busy="true"><p class="status">Building the index…</p></div>
<noscript><p lang="zh-CN">请启用 JavaScript 以加载图解目录。每个图解都提供简体中文和英文版本。</p><p lang="en">Enable JavaScript to load the guide list. Every guide is available in Simplified Chinese and English.</p></noscript></main>
<footer><div class="wrap"><p class="footer-note" data-copy="footer">One idea at a time. Pictures included.</p></div></footer>
</body>
</html>
